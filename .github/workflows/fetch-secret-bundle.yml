name: Fetch encrypted secret bundle
on:
  workflow_call:
jobs:
  fetch:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: bundle
        uses: WaveSpeedAI/secret-controller/actions/mcp-server@bundles
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-server-secret-bundle-${{ github.run_id }}
          overwrite: true
          path: ${{ steps.bundle.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
