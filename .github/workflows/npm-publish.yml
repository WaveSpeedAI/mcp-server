name: Publish Package

on:
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    if: >-
      github.repository == 'WaveSpeedAI/mcp-server' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm publish

  registry:
    name: Publish to the MCP registry
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher

      - name: Sign in with the DNS key and publish
        env:
          # The ed25519 DNS-auth key (PEM). Source of truth lives in
          # ws-secrets (v1/services/mcp-server/prod/); the encrypted
          # secret-controller bundle is retained as backup only — CI reads
          # this repo secret directly.
          MCP_REGISTRY_DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          key_pem="$RUNNER_TEMP/mcp-registry-dns-key.pem"
          trap 'rm -f -- "$key_pem"' EXIT
          test -n "$MCP_REGISTRY_DNS_KEY"
          printf '%s\n' "$MCP_REGISTRY_DNS_KEY" >"$key_pem"
          dns_key_hex="$(openssl pkey -in "$key_pem" -noout -text \
            | sed -n '/priv:/,/pub:/p' | grep -v 'priv:\|pub:' | tr -d ' :\n')"
          test -n "$dns_key_hex"
          "$RUNNER_TEMP/mcp-publisher" login dns --domain wavespeed.ai --private-key "$dns_key_hex"
          "$RUNNER_TEMP/mcp-publisher" publish
